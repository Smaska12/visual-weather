<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз погоды</title>
    <link rel="stylesheet" href="style/main.css">
</head>
<body>
    <div class="search-bar">
        <input type="text" class="city-name" value="Москва">
        <button class="btn-search">Поиск</button>

        <div class="search-result-bar">
            <ul>
                <li class="latitude" data-name="latitude">1</li>
                <li class="longitude" data-name="longitude">2</li>
                <li class="wind-speed" data-name="wind-speed">3</li>
                <li class="humidity" data-name="humidity">4</li>
                <li class="temp" data-name="temp">5</li>
                <li class="day-status" data-name="day-status">6</li>
                <li class="weather-code" data-name="weather-code">8</li>
            </ul>
        </div>
    </div>
    
    
    <script src="script/script.js"></script>
</body>
</html>
