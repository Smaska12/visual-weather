<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз погоды</title>
    <link rel="stylesheet" href="style/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-card">
        <div class="loader" id="loader">
            <div class="spinner"></div>
        </div>
        <div class="content" id="content">
            <label class="search-bar">
                <input type="text" class="city-name" value="Москва" placeholder="Search city...">
                <button class="btn-search" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 30 30">
                        <path d="M 13 3 C 7.4889971 3 3 7.4889971 3 13 C 3 18.511003 7.4889971 23 13 23 C 15.396508 23 17.597385 22.148986 19.322266 20.736328 L 25.292969 26.707031 A 1.0001 1.0001 0 1 0 26.707031 25.292969 L 20.736328 19.322266 C 22.148986 17.597385 23 15.396508 23 13 C 23 7.4889971 18.511003 3 13 3 z M 13 5 C 17.430123 5 21 8.5698774 21 13 C 21 17.430123 17.430123 21 13 21 C 8.5698774 21 5 17.430123 5 13 C 5 8.5698774 8.5698774 5 13 5 z"></path>
                    </svg>
                </button>
            </label>
            
            <div class="bg-area">
                <div class="search-result-bar">
                    <ul class="list-info">
                        <!-- <li class="latitude" data-name="latitude"></li>
                        <li class="longitude" data-name="longitude"></li> -->
                        <li class="city" data-name="city">
                            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 21s-6-5.686-6-10a6 6 0 0 1 12 0c0 4.314-6 10-6 10z"></path>
                                <circle cx="12" cy="11" r="2.5"></circle>
                            </svg>
                            <span class="value">Город</span>
                        </li>
                        <li class="date" data-name="date">
                            <span class="value">Дата</span>
                        </li>
                        <li class="wind-speed" data-name="wind-speed">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9.59 4.59A2 2 0 1 1 11 8H2"></path>
                                <path d="M12.59 19.41A2 2 0 1 0 14 16H2"></path>
                                <path d="M17.73 7.73A2.5 2.5 0 1 1 19.5 12H2"></path>
                            </svg>
                            <span class="value">Скорость ветра</span>
                        </li>
                        <li class="humidity" data-name="humidity">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2.69s6 6.5 6 10.19a6 6 0 0 1-12 0c0-3.69 6-10.19 6-10.19z"></path>
                            </svg>
                            <span class="value">Влажность</span>
                        </li>
                        <li class="temp" data-name="temp">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0z"></path>
                            </svg>
                            <span class="value">Температура</span><p>&deg;C</p>
                        </li>
                        <li class="day-status" data-name="day-status">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="4"></circle>
                                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                            </svg>
                            <span class="value">Время суток</span>
                        </li>
                        <li class="weather-code" data-name="weather-code">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 19a5 5 0 0 1-1-9.9A6 6 0 0 1 17.7 8 4.5 4.5 0 0 1 17 17H8z"></path>
                            </svg>
                            <span class="value">Осадки</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        
        
    </div>
    
    
    <script src="script/script.js"></script>
</body>
</html>
